# Builds Unglom and its installer on every push and pull request, and
# publishes a GitHub release with the installer when a v<version> tag is
# pushed. The tag must match the version in src\common\Version.h.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Unglom and the installer
        shell: cmd
        run: installer\build-installer.cmd nopause

      - name: Check the tag matches Version.h
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $built = (Get-Item out\Unglom.exe).VersionInfo.ProductVersion
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($built -ne $tag) {
            Write-Error "Tag is v$tag but src\common\Version.h says $built. Bump Version.h or re-tag."
            exit 1
          }

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem out\UnglomSetup-*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" |
              Set-Content -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: UnglomSetup
          path: |
            out/UnglomSetup-*.exe
            out/UnglomSetup-*.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UnglomSetup
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Unglom ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
